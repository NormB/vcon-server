# cargo-deny's rules for the workspace and for the fuzz package (CI runs
# `cargo deny check licenses bans sources` on both). Known vulnerabilities
# are osv-scanner.yml's job, so the advisories check is not run here.
#
# Every licence allowed below is one a crate in Cargo.lock or
# fuzz/Cargo.lock is under today, with the reason it may be shipped in, or
# built with, a crate licensed MIT OR Apache-2.0. A crate under any other
# licence fails the check until someone reads that licence and adds it
# here with a reason.

[graph]
all-features = true

[licenses]
allow = [
  # The project's own licences, and the most common licences of the
  # crates it uses: permissive, notice-only.
  "MIT",
  "Apache-2.0",
  # Apache-2.0 with an exception that only waives conditions for code
  # compiled by LLVM tools (wasi). Permissive.
  "Apache-2.0 WITH LLVM-exception",
  # Permissive, notice-only BSD and ISC licences (aws-lc-sys, encoding_rs,
  # matchit, sqlcipher-src, subtle; rustls, rustls-webpki, untrusted and others).
  "BSD-3-Clause",
  "ISC",
  # Public-domain-like dedications with no conditions (adler2, dunce,
  # aws-lc-sys, memchr, walkdir and others).
  "0BSD",
  "CC0-1.0",
  "MIT-0",
  "Unlicense",
  # The zlib licence: permissive, asks only that changes be marked
  # (foldhash, miniz_oxide).
  "Zlib",
  # The Unicode data licence of the ICU crates: permissive, notice-only.
  "Unicode-3.0",
  # The permissive Community Data License Agreement of
  # webpki-root-certs, which holds Mozilla's root certificate data.
  "CDLA-Permissive-2.0",
  # SQLite's public-domain blessing and the WTFPL, under which
  # sqlcipher-src ships parts of SQLite and libtomcrypt; it comes in
  # through rusqlite's bundled-sqlcipher feature. Neither sets a
  # condition.
  "blessing",
  "WTFPL",
  # The University of Illinois/NCSA licence of LLVM's libFuzzer, which
  # libfuzzer-sys builds into the fuzz targets only. Permissive,
  # notice-only; nothing that ships includes it.
  "NCSA",
]
confidence-threshold = 0.93

[bans]
# Two versions of one crate are allowed (core-foundation, hashbrown, syn
# and untrusted have two today), and shown.
multiple-versions = "warn"
# A dependency without a version is refused, except a path dependency
# inside this repository (the workspace crates and the fuzz package).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only, and one git repository: the rusqlite fork the tests use
# (crates/vcon-server/Cargo.toml says why and when it goes).
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/NormB/rusqlite"]
