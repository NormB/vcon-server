[package]
name = "vcon"
description = "A library for vCons. It reads and checks a vCon: form, compression, uuid and critical extensions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vcon"
readme = "README.md"
keywords = ["vcon", "ietf", "conversation", "jws", "validation"]
categories = ["parser-implementations", "encoding"]
# Only what a build and the crates.io page need: no tests, fixtures,
# website or brand files. Each pattern starts with / so it matches only at
# the crate root, not in every directory.
include = ["/src/**/*.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
serde = "1.0.229"
serde_json = "1.0.154"
sha1_smol = "1.0.1"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
uuid = "1.29.0"
zeroize = "1.9.1"

[dev-dependencies]
proptest = "1.12.0"

# The workspace's style lints ([workspace.lints] in ../../Cargo.toml),
# written out here because a crate takes either the workspace's table or its
# own, and vcon adds one: it reads untrusted bytes and has no unsafe code of
# its own, so Miri and AddressSanitizer (.github/workflows/sanitizers.yml)
# have nothing in it to check, and unsafe_code = "forbid" keeps it that way
# in every target of the crate. scripts/check_style.py fails if this table
# lacks a workspace lint.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
borrowed_box = "deny"
ptr_arg = "deny"
should_implement_trait = "deny"
wrong_self_convention = "deny"
new_without_default = "deny"
len_without_is_empty = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
allow_attributes_without_reason = "deny"
