<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>vcon-server console</title>
<link rel="stylesheet" href="console.css">
<script type="module" src="console.js"></script>
</head>
<body>
<header>
<h1>vcon-server console</h1>
<div id="signed-in" hidden>
<span id="who"></span>
<button id="sign-out" type="button">Sign out</button>
</div>
</header>
<main>
<form id="sign-in">
<label for="key">API key</label>
<input id="key" name="key" type="password" autocomplete="off" spellcheck="false" required>
<button type="submit">Sign in</button>
<p id="sign-in-error" role="alert"></p>
</form>
<section id="key-info" hidden>
<h2>This key</h2>
<dl id="key-fields"></dl>
</section>
<nav id="views" hidden></nav>
<section id="view" hidden></section>
</main>
</body>
</html>
