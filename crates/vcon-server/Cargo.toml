[package]
name = "vcon-server"
description = "Stores vCons encrypted at rest and returns them to authorised readers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vcon-server"
readme = "README.md"
keywords = ["vcon", "ietf", "conversation", "server", "encryption"]
categories = ["web-programming::http-server", "cryptography"]
# Only what a build and the crates.io page need: no tests, fixtures,
# website or brand files. Each pattern starts with / so it matches only at
# the crate root, not in every directory.
include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    # Read by include_str! and include_bytes!: the OpenAPI description and the
    # console's files.
    "/openapi.json",
    "/console/index.html",
    "/console/console.js",
    "/console/console.css",
]

[dependencies]
aws-lc-rs = "1.18.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "matched-path"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
form_urlencoded = "1.2.2"
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service", "http1", "http2"] }
libc = "0.2.191"
rusqlite = { version = "0.41.0", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
tokio-rustls = "0.26.6"
toml = "1.1.8"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
uuid = "1.29.0"
vcon = { path = "../vcon", version = "0.2.0" }
zeroize = "1.9.1"

[dev-dependencies]
# rusqlite 0.41.0's pragma helpers refuse SQLCipher's own pragma names
# (cipher_log_level and the rest), so the server sets them as plain SQL.
# This fork adds those names and nothing else; the tests use it to check
# that the plain SQL reads back what the helpers do. It is for tests only:
# the server builds against crates.io rusqlite. Remove it, its patch in the
# workspace Cargo.toml and the plain SQL once a crates.io rusqlite accepts
# the names (the test catalog::tests::crates_io_rusqlite_refuses_sqlcipher_names
# fails then).
rusqlite_fork = { package = "rusqlite", git = "https://github.com/NormB/rusqlite", rev = "a2936ca6190f54e7ab54375385877cc96eebebe5", features = ["bundled-sqlcipher-vendored-openssl"] }
flate2 = "1.1.10"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
reqwest = "0.13.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
time = { version = "0.3.55", features = ["macros"] }
