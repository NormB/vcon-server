[package]
name = "vcon-server"
description = "Stores vCons encrypted at rest and returns them to authorised readers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs = "1.18.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "matched-path"] }
base64 = "0.23.1"
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service", "http1", "http2"] }
libc = "0.2.191"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
rustls = "0.23.46"
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-rustls = "0.26.6"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = "1.29.0"
vcon-form = { path = "../vcon-form" }
zeroize = "1.9.1"

[dev-dependencies]
flate2 = "1.1.10"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
reqwest = "0.13.5"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["macros"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
