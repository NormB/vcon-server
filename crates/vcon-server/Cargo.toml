[package]
name = "vcon-server"
description = "Stores vCons encrypted at rest, on local disk or in an S3 bucket (as objects or Parquet files), and returns them to authorized readers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/vcon-server"
readme = "README.md"
keywords = ["vcon", "ietf", "conversation", "server", "encryption"]
categories = ["web-programming::http-server", "cryptography"]
# Only what a build and the crates.io page need: no tests, fixtures,
# website or brand files. Each pattern starts with / so it matches only at
# the crate root, not in every directory.
include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    # Read by include_str! and include_bytes!: the OpenAPI description and the
    # console's files.
    "/openapi.json",
    "/console/index.html",
    "/console/console.js",
    "/console/console.css",
    "/console/format.js",
    "/console/player.html",
    "/console/player.js",
]

[dependencies]
aws-config = { version = "1.13.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-lc-rs = "1.18.2"
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-smithy-http-client = { version = "1.5.2", default-features = false, features = ["rustls-aws-lc"], optional = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "matched-path"] }
base64 = "0.23.1"
# The buffer type parquet's readers take: a pack file's footer and pages are
# read into it. Already in the build through parquet and the S3 client.
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service", "http1", "http2"] }
libc = "0.2.191"
# Parquet files for `export parquet` and the pack files of Parquet storage:
# the column writer and the page reader only. No Arrow, and
# no compression codec: a sealed body is AES-GCM ciphertext, which does not
# compress, and the metadata columns are small.
parquet = { version = "=60.0.0", default-features = false }
# The terminal UI (cargo feature tui, on by default): the widgets, and
# through them crossterm for the terminal itself.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rmcp = { version = "3.9.0", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "transport-io",
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
rusqlite = { version = "0.41.0", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
tokio-rustls = "0.26.6"
# The PostgreSQL catalog (cargo feature postgres): the client, without its
# default features, and its rustls connector on the rustls and AWS-LC stack
# above. The pool is the crate's own (backend/postgres/pool.rs).
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"], optional = true }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, optional = true }
# The system's certificate authorities, for a PostgreSQL server without a
# catalog.postgres.ca_file; already in the build through the S3 client.
rustls-native-certs = { version = "0.8.5", optional = true }
toml = "1.1.8"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
uuid = "1.29.0"
vcon = { path = "../vcon", version = "0.4.2" }
zeroize = "1.9.1"

[features]
default = ["s3", "tui"]
# Objects in an S3-compatible bucket (RustFS, MinIO, AWS S3).
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-smithy-http-client"]
# The store conformance suite against real services: run with the service
# addresses set (see backend/s3.rs); without them the suite fails.
backend-tests = []
# The catalogs in PostgreSQL ([catalog.postgres]), a preview: this release
# connects, checks the server and stops (see backend/postgres.rs).
# It needs S3 objects ([catalog] in configuration.md), so it turns s3 on.
postgres = ["s3", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls-native-certs"]
# `vcon-server tui`: a terminal UI that reads a running server over its HTTP
# API with one key. On by default, so the release binaries, `cargo install`
# and a build from source carry it (tests/release_features.rs holds that
# rule); `--no-default-features` leaves it out.
tui = ["dep:ratatui"]

[dev-dependencies]
# rusqlite 0.41.0's pragma helpers refuse SQLCipher's own pragma names
# (cipher_log_level and the rest), so the server sets them as plain SQL.
# This fork adds those names and nothing else; the tests use it to check
# that the plain SQL reads back what the helpers do. It is for tests only:
# the server builds against crates.io rusqlite. Remove it, its patch in the
# workspace Cargo.toml and the plain SQL once a crates.io rusqlite accepts
# the names (the test catalog::tests::crates_io_rusqlite_refuses_sqlcipher_names
# fails then).
rusqlite_fork = { package = "rusqlite", git = "https://github.com/NormB/rusqlite", rev = "a2936ca6190f54e7ab54375385877cc96eebebe5", features = ["bundled-sqlcipher-vendored-openssl"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
reqwest = "0.13.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
time = { version = "0.3.55", features = ["macros"] }

[lints]
workspace = true
