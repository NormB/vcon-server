[workspace]
resolver = "3"
members = ["crates/vcon-form", "crates/vcon-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# The rusqlite fork, a test-only dependency of vcon-server, would bring its
# own copy of libsqlite3-sys, and only one package may link SQLite. This
# gives it crates.io's 0.39.1, the one the server's rusqlite uses. Remove it
# with the fork (see crates/vcon-server/Cargo.toml).
[patch."https://github.com/NormB/rusqlite"]
libsqlite3-sys = "0.39.1"
