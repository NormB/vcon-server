name: Reproducible build

# Builds the x86_64 release binary twice from the same commit, in two
# checkouts with two CARGO_HOMEs, and fails if the two differ by one byte.
# The build is scripts/reproducible-build.sh `build`, the command
# release.yml's build step runs, so this proves the release's own build.
#
# Modeled on sipnab's reproducible.yml, on a GitHub-hosted runner instead of
# a self-hosted one. Weekly, and on pull requests that change what the build
# reads beyond the source: the manifests and the lockfile, the toolchain,
# the script and the release workflow. A change in src/ that breaks it (a
# build time compiled in, say) is caught by the weekly run.
on:
  schedule:
    # Fridays 04:23 UTC, clear of the other weekly runs.
    - cron: '23 4 * * 5'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'crates/*/build.rs'
      - 'rust-toolchain.toml'
      - 'scripts/reproducible-build.sh'
      - 'scripts/release-build-env.sh'
      - '.github/workflows/reproducible.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  reproducible:
    name: Reproducible build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    # Two release builds from nothing, and the second one's crate fetch.
    timeout-minutes: 60
    permissions:
      contents: read
    # The container release.yml builds in, digest for digest.
    container:
      image: almalinux:9@sha256:1dc2f882fd8c5c1eb4747953cf8516e0f36d4d4aeba6a17f97e7b12d495e8547
    steps:
      - name: Install git
        # No repository script exists before the checkout, so the retry is
        # inline; it cleans dnf's metadata between tries, since an empty
        # repomd.xml from a mirror is a parse error dnf does not retry.
        run: for i in 1 2 3 4 5; do dnf install -y git-core && break; [ "$i" = 5 ] && exit 1; dnf clean metadata; sleep $((i * 10)); done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare the build container
        run: bash scripts/release-build-env.sh
      # No build cache: the point is two builds from nothing.
      - name: Build twice and compare
        run: bash scripts/reproducible-build.sh check x86_64-unknown-linux-gnu "$RUNNER_TEMP/reproducible"

