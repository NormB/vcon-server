name: Reproducible build

# Builds each release binary twice from the same commit, in two checkouts
# with two CARGO_HOMEs, and fails if the two differ by one byte. The build
# is scripts/reproducible-build.sh `build`, the command release.yml's build
# step runs.
#
# Weekly, so a change in src/ that breaks it (a build time compiled in,
# say) is caught between releases. Not on a pull request and not on a tag:
# release.yml builds each target twice and compares the two on every tag,
# before it publishes, and on each pull request that changes what the
# build reads beyond the source.
#
# By hand, for the ref the run is started on (`gh workflow run
# reproducible.yml --ref v<version>` for a release) and any build time: the
# binary holds the build time (SOURCE_DATE_EPOCH, the commit's time unless
# one is given), so a release's digest is found again on its tag, and the
# digest a pull request's run printed with the time of its merge commit.
# The commit is never an input: a run by hand or on a schedule runs in the
# default branch's cache scope, and code from a ref a person typed must not
# run there (CodeQL actions/cache-poisoning). A run on a tag has the tag's
# own scope.
on:
  schedule:
    # Fridays 04:23 UTC, clear of the other weekly runs.
    - cron: '23 4 * * 5'
  workflow_dispatch:
    inputs:
      source_date_epoch:
        description: >-
          The build time, in seconds since 1970. Empty takes the time of
          the commit that is built.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  reproducible:
    name: Reproducible build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Two release builds from nothing, and the second one's crate fetch.
    timeout-minutes: 60
    permissions:
      contents: read
    # The container release.yml builds in, digest for digest.
    container:
      image: almalinux:9@sha256:1dc2f882fd8c5c1eb4747953cf8516e0f36d4d4aeba6a17f97e7b12d495e8547
    steps:
      # Two checkouts, as in release.yml's build job: the files first, for
      # the script that installs git and the build tools; then, with git
      # there, the checkout that keeps .git.
      - name: Fetch the files (no git yet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare the build container
        run: bash scripts/release-build-env.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No build cache: the point is two builds from nothing. The inputs
      # reach the script through the environment, never a command line.
      - name: Build twice and compare
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
        run: bash scripts/reproducible-build.sh check "$TARGET" "$RUNNER_TEMP/reproducible"

