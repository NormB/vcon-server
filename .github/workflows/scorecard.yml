name: OpenSSF Scorecard

# Scorecard grades the repository's supply-chain practice against the OpenSSF
# checks (pinned dependencies, token permissions, signed releases, dangerous
# workflow patterns and more) and publishes the findings to the Security tab.
# It reports and never fails a build: it measures practice, not the code.
# The weekly run catches what no push changes, such as repository settings.

on:
  branch_protection_rule:
  schedule:
    # Mondays 07:40 UTC, off the hour, when GitHub is least likely to drop it.
    - cron: '40 7 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      # Upload the findings to code scanning.
      security-events: write
      # Publish the score to the OpenSSF API, which backs the badge.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # Code scanning ages alerts out; the raw result is kept beside it.
      - name: Keep the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90
          if-no-files-found: error
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
          category: scorecard
