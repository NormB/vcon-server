name: CodeQL

# CodeQL analyses the Rust code, the JavaScript (the console the server
# serves, its browser tests and the site's search), and the workflows
# themselves (the `actions` language: untrusted input in run steps, token
# permissions, unpinned actions). Findings go to code scanning in the
# Security tab. No language needs a build: all are read from source.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays 02:34 UTC: newer CodeQL queries also run on code no push changed.
    - cron: '34 2 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The analysis (the Rust one took 11 min on 2026-11-16) and up to
    # 15 min of waiting for code scanning to process its results, and up
    # to 15 min more for a spent API budget (scripts/gh_rate_limit.py).
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      # Upload the findings to code scanning, and read its alerts back.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          # The findings go up as SARIF; the database is not needed.
          upload-database: false
      # The analyze step waits about 2.5 min for code scanning to process
      # the SARIF and then passes anyway. On #224 the processing never
      # finished, the pull request's `CodeQL` check concluded neutral and a
      # new alert reached main. This step fails the job unless code
      # scanning processed the SARIF and, on a pull request, the merge
      # commit has no open alert of this category that main does not have
      # (scripts/codeql_pr_gate.py).
      - name: Code scanning processed the results, and the pull request adds no alert
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
          CATEGORY: "/language:${{ matrix.language }}"
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: python3 -I scripts/codeql_pr_gate.py check --sarif-id "$SARIF_ID" --category "$CATEGORY" --pr "$PR" --base "${BASE:-main}" --wait 900
