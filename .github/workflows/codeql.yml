name: CodeQL

# CodeQL analyses the Rust code, the JavaScript (the console the server
# serves, its browser tests and the site's search), and the workflows
# themselves (the `actions` language: untrusted input in run steps, token
# permissions, unpinned actions). Findings go to code scanning in the
# Security tab. No language needs a build: all are read from source.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays 02:34 UTC: newer CodeQL queries also run on code no push changed.
    - cron: '34 2 * * 2'

permissions:
  contents: read

# The CodeQL version is pinned here and nowhere else. Until 2026-11-20 the
# action chose it at run time (GitHub's feature flags), whatever its own pin:
# main's run on 27e541e moved from CLI 2.27.4 to 2.27.5 with no change here,
# and 24 rust/cleartext-logging alerts opened on main. A new version is now a
# pull request that changes CODEQL_VERSION and the three bundle_sha256
# values below; the scheduled run fails while a newer bundle is released
# (scripts/codeql_pin.py, which also holds this file to the pin's shape).
#
# Diff-informed analysis is off, so a pull request's analysis reports the
# whole tree, and scripts/codeql_pr_gate.py refuses an alert a change opens
# anywhere: #251's analysis reported changed lines only, so it saw none of
# the 24 that 2.27.5 found in lines it did not change.
env:
  CODEQL_VERSION: 2.27.5
  CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The analysis (the Rust one took 11 min on 2026-11-16) and up to
    # 15 min of waiting for code scanning to process its results, and up
    # to 15 min more for a spent API budget (scripts/gh_rate_limit.py).
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      # Upload the findings to code scanning, and read its alerts back.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Each language's bundle and its sha256, the digest GitHub gives
        # for the asset of release codeql-bundle-v${CODEQL_VERSION}.
        include:
          - language: actions
            bundle: actions
            bundle_sha256: fd7915e9f242d823de40fafed58f49816dba8e5a8f443191924eaf9c792f6655
          - language: javascript-typescript
            bundle: javascript
            bundle_sha256: b10957140a7969819022eac23a6a37d0c6a65de12a84704ca71c416b980edb5c
          - language: rust
            bundle: rust
            bundle_sha256: fac16882d1c56f3cdfe502b1021e44407976e3260cc4660b4f898082c315fac9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The bundle through the one rule for release assets: cached by
      # version and sha256, the sha256 checked on every run.
      - name: The pinned CodeQL bundle
        id: bundle
        uses: ./.github/actions/pinned-download
        with:
          name: codeql-bundle-${{ matrix.bundle }}
          version: ${{ env.CODEQL_VERSION }}
          sha256: ${{ matrix.bundle_sha256 }}
          url: https://github.com/github/codeql-action/releases/download/codeql-bundle-v${{ env.CODEQL_VERSION }}/codeql-bundle-${{ matrix.bundle }}-linux64.tar.zst
          file: codeql-bundle-${{ matrix.bundle }}-linux64.tar.zst
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: ${{ steps.bundle.outputs.path }}
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          # The findings go up as SARIF; the database is not needed.
          upload-database: false
      # The analyze step waits about 2.5 min for code scanning to process
      # the SARIF and then passes anyway. On #224 the processing never
      # finished, the pull request's `CodeQL` check concluded neutral and a
      # new alert reached main. This step fails the job unless code
      # scanning processed the SARIF and, on a pull request, the merge
      # commit has no open alert of this category that main does not have
      # (scripts/codeql_pr_gate.py).
      - name: Code scanning processed the results, and the pull request adds no alert
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
          CATEGORY: "/language:${{ matrix.language }}"
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: python3 -I scripts/codeql_pr_gate.py check --sarif-id "$SARIF_ID" --category "$CATEGORY" --pr "$PR" --base "${BASE:-main}" --wait 900
      # The scheduled run, after its analysis with the pinned bundle, fails
      # while a newer bundle is released and prints the values to pin. One
      # job of the matrix asks; the answer is the same for each.
      - name: The pinned CodeQL is the newest released
        if: github.event_name == 'schedule' && matrix.language == 'rust'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/codeql_pin.py behind
