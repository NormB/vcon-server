name: ClusterFuzzLite

# The fuzz targets in fuzz/, built and run by ClusterFuzzLite in its own
# image (.clusterfuzzlite/). A pull request that touches code the targets
# read is fuzzed for five minutes against the change, a push to main for
# ten minutes, and every Monday all targets for an hour. CI's fuzz job also runs
# each target, on the runner, for 60 seconds with its planted panic.
#
# No storage repository is set, so the corpus and any crash come back as
# workflow artifacts.
on:
  pull_request:
    paths: &code
      - 'crates/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/clusterfuzzlite.yml'
  push:
    branches: [main]
    paths: *code
  schedule:
    # Mondays 04:41 UTC.
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clusterfuzzlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ClusterFuzzLite
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # No token and every target kept: the build looks up no artifact. To
      # drop unaffected targets it looks for a coverage report, which no
      # run here makes (no coverage mode), by reading the list of every
      # artifact of the repository, page by page (2,130 artifacts, 22 pages,
      # on 2026-11-20). Its loop ends only when it has read as many as the
      # first page's total_count; on 2026-11-19 (#245) it never got there
      # and asked for pages 1 to 4,948 in 19 minutes, which
      # spent the repository's hourly API budget, and main's next CodeQL,
      # OSV-Scanner, Scorecard and CI runs failed on it. With no report
      # found it kept every target anyway, so keeping them changes nothing.
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          keep-unaffected-fuzz-targets: true
      # A pull request is fuzzed against its change for five minutes; a push
      # to main for ten minutes and the weekly run for an hour, in batch,
      # all targets sharing the time.
      - name: Run the fuzz targets
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || github.event_name == 'push' && 600 || 3600 }}
          sanitizer: address
          parallel-fuzzing: ${{ github.event_name != 'pull_request' }}
