name: ClusterFuzzLite

# The fuzz targets in fuzz/, built and run by ClusterFuzzLite in its own
# image (.clusterfuzzlite/). A pull request that touches code the targets
# read is fuzzed for five minutes against the change; every Monday each
# target is fuzzed in batch for an hour in all. CI's fuzz job also runs
# each target, on the runner, for 60 seconds with its planted panic.
#
# No storage repository is set, so the corpus and any crash come back as
# workflow artifacts.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/clusterfuzzlite.yml'
  schedule:
    # Mondays 04:41 UTC.
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clusterfuzzlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: fuzz the change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run the fuzz targets
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address

  batch:
    name: batch fuzzing
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
      - name: Run the fuzz targets
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: batch
          sanitizer: address
          parallel-fuzzing: true
