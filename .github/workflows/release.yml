name: Release

# Builds the server for Linux on x86_64 and aarch64, writes a CycloneDX SBOM
# and SHA256SUMS.txt, and attests each archive's build provenance and its SBOM
# with Sigstore, so anyone can check a download with
#   gh attestation verify <file> --repo NormB/vcon-server
# A pushed v* tag publishes a GitHub release. A run started by hand builds and
# attests the same way and keeps the files as a workflow artifact, so the whole
# path is proven without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  version:
    name: version
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Name the version
        id: version
        # A tag must name the version Cargo.toml holds; a run by hand is that
        # version plus the commit it was built from.
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ -n "$cargo_version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "${GITHUB_REF_NAME}" = "v${cargo_version}" ] \
              || { echo "tag ${GITHUB_REF_NAME} is not v${cargo_version}" >&2; exit 1; }
            version="$cargo_version"
          else
            version="${cargo_version}-dev.${GITHUB_SHA::12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: version
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --release --locked -p vcon-server --target ${{ matrix.target }}
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="vcon-server-${VERSION}-${TARGET}"
          mkdir -p "$stage" dist
          cp "target/${TARGET}/release/vcon-server" LICENSE-MIT LICENSE-APACHE README.md "$stage/"
          "$stage/vcon-server" --version
          tar czf "dist/${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  attest:
    name: SBOM, checksums and attestations
    needs: [version, build]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sigstore signs with a short-lived certificate from the workflow's OIDC
      # identity; the attestations are stored with the repository.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CYCLONEDX_VERSION: '0.5.9'
      CYCLONEDX_SHA256: 'fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Write the SBOM
        run: |
          set -euo pipefail
          rustup toolchain install
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o cyclonedx.tar.xz \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CYCLONEDX_VERSION}/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
          echo "${CYCLONEDX_SHA256}  cyclonedx.tar.xz" | sha256sum -c -
          tar xJf cyclonedx.tar.xz --strip-components=1 cargo-cyclonedx-x86_64-unknown-linux-gnu/cargo-cyclonedx
          ./cargo-cyclonedx cyclonedx --format json --spec-version 1.5 --override-filename sbom
          mv crates/vcon-server/sbom.json "dist/vcon-server-${VERSION}.cdx.json"
          rm -f cargo-cyclonedx cyclonedx.tar.xz crates/*/sbom.json
      - name: Write the checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.cdx.json > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS.txt
      - name: Attest the SBOM to each archive
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/vcon-server-${{ env.VERSION }}.cdx.json
      # The attestations are checked here, against a real archive, the way a
      # user checks them; and a changed copy of it must not verify.
      - name: Verify what was attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom
          done
          changed="$RUNNER_TEMP/changed.tar.gz"
          cp "$(ls dist/*.tar.gz | head -1)" "$changed"
          printf 'x' >> "$changed"
          if gh attestation verify "$changed" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "a changed archive verified" >&2
            exit 1
          fi
          rm -f "$changed"
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcon-server-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [version, attest]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vcon-server-${{ needs.version.outputs.version }}
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "vcon-server ${VERSION}" --verify-tag \
            --notes "Verify a download with: gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
