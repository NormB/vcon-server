name: Release

# Builds the server for Linux on x86_64 and aarch64, writes a CycloneDX SBOM
# and SHA256SUMS.txt, and attests each archive's build provenance and its SBOM
# with Sigstore, so anyone can check a download with
#   gh attestation verify <file> --repo NormB/vcon-server
# A pushed v* tag publishes a GitHub release, then publishes vcon and
# vcon-server on crates.io by trusted publishing. A run started by hand builds
# and attests the same way and keeps the files as a workflow artifact, and
# runs the crates.io job as a dry run, so the whole path is proven without
# publishing anything.
on:
  push:
    tags: ['v*']
  # A pull request that changes the build builds both binaries and holds
  # them to the glibc floor; nothing is attested, released or published.
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'rust-toolchain.toml'
      - 'scripts/reproducible-build.sh'
      - 'scripts/release-build-env.sh'
      - 'scripts/check_glibc.py'
      - 'scripts/run-clients.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      crates_io_dry_run:
        description: >-
          Run the crates.io job as a dry run: the trusted-publishing token
          exchange, then cargo publish --dry-run for both crates. Nothing is
          uploaded.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  # The oldest glibc the release binaries run on: RHEL 9 and AlmaLinux 9
  # (2.34); Ubuntu 22.04 has 2.35, Debian 12 2.36.
  GLIBC_FLOOR: '2.34'

jobs:
  version:
    name: version
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Name the version
        id: version
        # A tag must name the version Cargo.toml holds; a run by hand is that
        # version plus the commit it was built from.
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ -n "$cargo_version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "${GITHUB_REF_NAME}" = "v${cargo_version}" ] \
              || { echo "tag ${GITHUB_REF_NAME} is not v${cargo_version}" >&2; exit 1; }
            version="$cargo_version"
          else
            version="${cargo_version}-dev.${GITHUB_SHA::12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: version
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Built on the floor's glibc, so the binaries take no newer symbol
    # version: on ubuntu-latest (glibc 2.39) v0.2.0 needed GLIBC_2.38. The
    # image is multi-architecture; this digest names both platforms.
    steps:
      # Before the checkout, which keeps .git only when git is installed;
      # the build takes SOURCE_DATE_EPOCH from the commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The reproducible build (scripts/reproducible-build.sh): the same
      # command reproducible.yml runs twice and compares.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="$(bash scripts/reproducible-build.sh build "$TARGET" | tail -1)"
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="vcon-server-${VERSION}-${TARGET}"
          mkdir -p "$stage" dist
          cp "$BIN" LICENSE-MIT LICENSE-APACHE README.md "$stage/"
          "$stage/vcon-server" --version
          tar czf "dist/${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Each binary as a user runs it, on each distribution at or above the
  # floor: --version, then a vCon stored, listed, read and deleted through
  # the curl client against a live server (scripts/run-clients.sh).
  smoke:
    name: run on ${{ matrix.image }} (${{ matrix.target }})
    needs: [version, build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        image:
          - debian:12@sha256:854dd8ab51d62866dbd8f5431d15ce77b12983a2a4a1e1fe43a2395dc7ef9f61
          - ubuntu:22.04@sha256:e0f80c829509ef4df9e76bd8944eb7b8ec25cbb379b112a7f9448b2c77a77c9b
          - almalinux:9@sha256:1dc2f882fd8c5c1eb4747953cf8516e0f36d4d4aeba6a17f97e7b12d495e8547
    runs-on: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ${{ matrix.image }}
      # The server locks all its memory before it reads a key.
      options: --ulimit memlock=-1:-1
    steps:
      - name: Install what the curl client needs
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends curl jq openssl python3 ca-certificates >/dev/null
          else
            dnf install -y --setopt=install_weak_deps=False jq openssl python3 >/dev/null
          fi
          ldd --version | sed -n 1p
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist
      - name: Run the binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          tar xzf "dist/vcon-server-${VERSION}-${TARGET}.tar.gz" -C dist
          bin="dist/vcon-server-${VERSION}-${TARGET}/vcon-server"
          "$bin" --version
          RUN_CLIENTS=curl bash scripts/run-clients.sh "$bin" -

  attest:
    name: SBOM, checksums and attestations
    needs: [version, build, smoke]
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sigstore signs with a short-lived certificate from the workflow's OIDC
      # identity; the attestations are stored with the repository.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CYCLONEDX_VERSION: '0.5.9'
      CYCLONEDX_SHA256: 'fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Write the SBOM
        run: |
          set -euo pipefail
          rustup toolchain install
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o cyclonedx.tar.xz \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CYCLONEDX_VERSION}/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
          echo "${CYCLONEDX_SHA256}  cyclonedx.tar.xz" | sha256sum -c -
          tar xJf cyclonedx.tar.xz --strip-components=1 cargo-cyclonedx-x86_64-unknown-linux-gnu/cargo-cyclonedx
          ./cargo-cyclonedx cyclonedx --format json --spec-version 1.5 --override-filename sbom
          mv crates/vcon-server/sbom.json "dist/vcon-server-${VERSION}.cdx.json"
          rm -f cargo-cyclonedx cyclonedx.tar.xz crates/*/sbom.json
      - name: Write the checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.cdx.json > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS.txt
      - name: Attest the SBOM to each archive
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/vcon-server-${{ env.VERSION }}.cdx.json
      # The attestations are checked here, against a real archive, the way a
      # user checks them; and a changed copy of it must not verify.
      - name: Verify what was attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom
          done
          changed="$RUNNER_TEMP/changed.tar.gz"
          archives=(dist/*.tar.gz)
          cp "${archives[0]}" "$changed"
          printf 'x' >> "$changed"
          if gh attestation verify "$changed" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "a changed archive verified" >&2
            exit 1
          fi
          rm -f "$changed"
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vcon-server-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [version, attest]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vcon-server-${{ needs.version.outputs.version }}
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "vcon-server ${VERSION}" --verify-tag \
            --notes "Verify a download with: gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"

  crates-io:
    name: crates.io
    # On a v* tag, after the GitHub release: publishes each crate whose
    # version crates.io does not have yet, vcon before vcon-server, so a run
    # again never fails on a version already there. A crates.io version can
    # never be replaced, so nothing uploads before the release exists. By
    # hand: the token exchange, then cargo publish --dry-run, uploading
    # nothing.
    needs: [version, publish]
    if: >-
      ${{ !cancelled() &&
          ((github.ref_type == 'tag' && needs.publish.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && inputs.crates_io_dry_run)) }}
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # crates.io's trusted publisher for both crates names this workflow,
    # release.yml, and no environment, so this job names none. Once the
    # trusted publishers on crates.io name the environment crates-io, this
    # job takes `environment: crates-io` too; that GitHub environment exists
    # and allows only v* tags and main.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Exchanges this job's OIDC identity for a short-lived crates.io token,
      # and revokes it when the job ends. No crates.io credential is stored
      # in the repository.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # The exchange is the proof that trusted publishing works: crates.io
      # issued a token to this workflow. Only its length is logged.
      - name: Check the token exchange
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          [ -n "$TOKEN" ] || { echo "the token exchange returned no token" >&2; exit 1; }
          echo "crates.io issued a token by trusted publishing (${#TOKEN} characters)"
      # A run by hand dry-runs both crates in one cargo publish, so a new
      # vcon version the server needs is verified against the packaged vcon
      # before it is on crates.io; a version already there is only warned
      # about, and nothing is uploaded. A tag looks each crate up on
      # crates.io at its own version, vcon first, publishes what is not
      # there and skips what is.
      - name: Publish what crates.io does not have yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ github.event_name != 'push' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            cargo publish --dry-run --locked -p vcon -p vcon-server
          fi
          for crate in vcon vcon-server; do
            # Each crate's own version: the crates are versioned apart.
            version="$(cargo pkgid -p "$crate" | sed 's/.*[#@]//')"
            [ -n "$version" ] || { echo "no version for ${crate}" >&2; exit 1; }
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'vcon-server release workflow (https://github.com/NormB/vcon-server)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            case "$status" in
              200)
                if [ "$DRY_RUN" = true ]; then
                  echo "${crate} ${version}: version already published: verified package only"
                else
                  echo "${crate} ${version} is already on crates.io; skipped"
                fi ;;
              404)
                if [ "$DRY_RUN" = true ]; then
                  echo "${crate} ${version}: new version: dry run passed"
                else
                  cargo publish --locked -p "$crate"
                fi ;;
              *) echo "crates.io answered ${status} for ${crate} ${version}" >&2; exit 1 ;;
            esac
          done
