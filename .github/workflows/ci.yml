name: CI

# The checks the commit hook runs, run again on GitHub for every push to main
# and every pull request, so a change that skipped the hook is still caught.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  rust:
    name: fmt, clippy, tests
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        # rust-toolchain.toml names the version and its components.
        run: scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the pinned cargo-nextest
        # The tests run under it, for the per-test deadline in
        # .config/nextest.toml; scripts/nextest.sh pins it by SHA-256, and
        # the action fetches it through the one pinned-download rule.
        uses: ./.github/actions/nextest
      - name: Format
        # rustfmt.toml's options need the nightly rustfmt the script pins;
        # it checks the fuzz package too, which --all misses.
        run: |
          scripts/rustfmt.sh install
          scripts/rustfmt.sh --check
      - name: Style rules rustfmt and clippy do not check
        run: |
          python3 -I scripts/test_check_style.py
          python3 -I scripts/check_style.py
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: Documentation, with rustdoc's warnings denied
        # A link that does not resolve, or one from public documentation to
        # a private item, fails here; the commit hook runs the same command
        # (tests/rustdoc_gate.rs).
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked --quiet
      - name: Tests
        # Every command locks all of its memory before it reads a key, and the
        # tests run the binary; the runner's default lock limit is too small.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          # Every failing test reported, not only the first. Each test runs
          # under nextest's deadline (.config/nextest.toml); nextest does not
          # run doc tests, so cargo test runs those. The output is kept: the
          # home page's test count is derived from it.
          scripts/nextest.sh run --workspace --locked --no-fail-fast 2>&1 | tee test-output.txt
          cargo test --workspace --locked --no-fail-fast --doc 2>&1 | tee -a test-output.txt
          scripts/nextest.sh run --manifest-path fuzz/Cargo.toml --lib --locked --no-fail-fast 2>&1 | tee -a test-output.txt
      - name: Count the tests
        # The rule pages.yml publishes by; a run it cannot count fails here.
        run: python3 -I scripts/published_metrics.py --tests test-output.txt
      # pages.yml reads this artifact from CI's run of the commit it deploys.
      - name: Keep the test output
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-output
          path: test-output.txt
          retention-days: 14
          if-no-files-found: error
      - name: Packages
        # What each crate would publish to crates.io, checked from the
        # .crate files themselves; the commit hook runs the same.
        run: |
          set -euo pipefail
          python3 -I scripts/test_check_package.py
          python3 -I scripts/check_package.py
          # Two runs in one target directory, and two trees at once.
          bash scripts/test-check-package.sh

  backends:
    # The store conformance suite, the S3 backend's own tests, the Parquet
    # export's tests (to a bucket, and read back with DuckDB), the pack
    # files' tests (read back with DuckDB) and `serve`
    # with its objects in a bucket, against a real S3-compatible service:
    # RustFS 1.0.4, pinned by the digest of its multi-platform index, as a
    # service container that only this job reaches. Each test makes a
    # bucket of its own. The tests fail, never skip, when the service is
    # not there.
    name: storage backends (RustFS)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2 # 1.0.4
        env:
          RUSTFS_ACCESS_KEY: vcontest
          RUSTFS_SECRET_KEY: vcon-ci-only-secret
        ports:
          - 127.0.0.1:9000:9000
    env:
      VCON_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      VCON_TEST_S3_ACCESS_KEY: vcontest
      VCON_TEST_S3_SECRET_KEY: vcon-ci-only-secret
      # The DuckDB CLI the export tests read Parquet files with, pinned by
      # the SHA-256 of its release asset (GitHub's asset digest).
      DUCKDB_VERSION: 1.5.6
      DUCKDB_SHA256: 6e89deac1ebbc36eed0291caf8b567b030c7b86ac35998f71854e22b3c5d5e2f
      VCON_TEST_DUCKDB: ${{ github.workspace }}/.duckdb/duckdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the pinned cargo-nextest
        # The tests run under it, for the per-test deadline in
        # .config/nextest.toml; scripts/nextest.sh pins it by SHA-256, and
        # the action fetches it through the one pinned-download rule.
        uses: ./.github/actions/nextest
      - name: Get the pinned DuckDB CLI
        id: duckdb
        uses: ./.github/actions/pinned-download
        with:
          name: duckdb
          version: ${{ env.DUCKDB_VERSION }}
          sha256: ${{ env.DUCKDB_SHA256 }}
          url: https://github.com/duckdb/duckdb/releases/download/v${{ env.DUCKDB_VERSION }}/duckdb_cli-linux-amd64.zip
          file: duckdb_cli-linux-amd64.zip
      - name: Install the pinned DuckDB CLI
        env:
          ARCHIVE: ${{ steps.duckdb.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p .duckdb
          unzip -q "$ARCHIVE" -d .duckdb
          "$VCON_TEST_DUCKDB" --version
      - name: Wait for RustFS
        # A store listens before it can serve: the script waits for a
        # signed request to answer 200.
        run: scripts/wait-for-s3.sh RustFS
      - name: Clippy with the backend tests, and without the default features (S3, the terminal UI)
        run: |
          cargo clippy -p vcon-server --all-targets --locked --features backend-tests -- -D warnings
          cargo clippy -p vcon-server --all-targets --locked --no-default-features -- -D warnings
      - name: Backend tests
        # The serve test runs the binary, which locks all of its memory.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          scripts/nextest.sh run -p vcon-server --locked --features backend-tests --no-fail-fast --lib "backend::"
          scripts/nextest.sh run -p vcon-server --locked --features backend-tests --no-fail-fast --lib "export::"
          scripts/nextest.sh run -p vcon-server --locked --features backend-tests --no-fail-fast --lib "store::packed::"
          scripts/nextest.sh run -p vcon-server --locked --features backend-tests --no-fail-fast --lib "commands::"
          scripts/nextest.sh run -p vcon-server --locked --features backend-tests --no-fail-fast --test serve "s3::"

  backends-minio:
    # The same tests as `backends`, against MinIO. MinIO's community
    # edition is no longer maintained and has no container image; this is
    # its last release with a published Linux binary, fetched from its
    # GitHub release and checked against the SHA-256 pinned here. It runs
    # on the loopback address only. The suite includes the conditional
    # write (If-None-Match: *) that the claim on a prefix needs:
    # backend::s3::remote::a_claim_object_is_never_written_over.
    name: storage backends (MinIO)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
      MINIO_SHA256: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
      VCON_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      VCON_TEST_S3_ACCESS_KEY: vcontest
      VCON_TEST_S3_SECRET_KEY: vcon-ci-only-secret
      # The DuckDB CLI the Parquet storage tests read the files with,
      # pinned as in `backends`.
      DUCKDB_VERSION: 1.5.6
      DUCKDB_SHA256: 6e89deac1ebbc36eed0291caf8b567b030c7b86ac35998f71854e22b3c5d5e2f
      VCON_TEST_DUCKDB: ${{ github.workspace }}/.duckdb/duckdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the pinned cargo-nextest
        # The tests run under it, for the per-test deadline in
        # .config/nextest.toml; scripts/nextest.sh pins it by SHA-256, and
        # the action fetches it through the one pinned-download rule.
        uses: ./.github/actions/nextest
      - name: Get the pinned DuckDB CLI
        id: duckdb
        uses: ./.github/actions/pinned-download
        with:
          name: duckdb
          version: ${{ env.DUCKDB_VERSION }}
          sha256: ${{ env.DUCKDB_SHA256 }}
          url: https://github.com/duckdb/duckdb/releases/download/v${{ env.DUCKDB_VERSION }}/duckdb_cli-linux-amd64.zip
          file: duckdb_cli-linux-amd64.zip
      - name: Install the pinned DuckDB CLI
        env:
          ARCHIVE: ${{ steps.duckdb.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p .duckdb
          unzip -q "$ARCHIVE" -d .duckdb
          "$VCON_TEST_DUCKDB" --version
      - name: Get the pinned MinIO server
        id: minio
        uses: ./.github/actions/pinned-download
        with:
          name: minio
          version: ${{ env.MINIO_RELEASE }}
          sha256: ${{ env.MINIO_SHA256 }}
          url: https://github.com/minio/minio/releases/download/${{ env.MINIO_RELEASE }}/minio.linux-amd64.${{ env.MINIO_RELEASE }}
          file: minio
      - name: Start MinIO
        # It listens before it is initialized and answers 503 until it is:
        # the script waits for a signed request to answer 200.
        env:
          MINIO_BINARY: ${{ steps.minio.outputs.path }}
        run: |
          set -euo pipefail
          install -m 0755 "$MINIO_BINARY" "$RUNNER_TEMP/minio"
          "$RUNNER_TEMP/minio" --version
          mkdir "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER="$VCON_TEST_S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$VCON_TEST_S3_SECRET_KEY" \
            nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 > "$RUNNER_TEMP/minio.log" 2>&1 &
          scripts/wait-for-s3.sh MinIO "$RUNNER_TEMP/minio.log"
      - name: The service refuses a second write with If-None-Match
        run: |
          set -euo pipefail
          s3=(--aws-sigv4 aws:amz:us-east-1:s3 --user "$VCON_TEST_S3_ACCESS_KEY:$VCON_TEST_S3_SECRET_KEY")
          curl -sS --fail-with-body "${s3[@]}" -X PUT "$VCON_TEST_S3_ENDPOINT/vcon-ci-conditional"
          for want in 200 412; do
            got=$(curl -sS -o /dev/null -w '%{http_code}' "${s3[@]}" -X PUT -H 'If-None-Match: *' \
              --data-binary claim "$VCON_TEST_S3_ENDPOINT/vcon-ci-conditional/claim")
            echo "PUT If-None-Match: * answered $got"
            [ "$got" = "$want" ] || { echo "expected $want" >&2; exit 1; }
          done
      - name: Backend tests
        # The serve test runs the binary, which locks all of its memory.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          scripts/nextest.sh run -p vcon-server --locked --features backend-tests --no-fail-fast --lib "backend::"
          scripts/nextest.sh run -p vcon-server --locked --features backend-tests --no-fail-fast --lib "commands::"
          scripts/nextest.sh run -p vcon-server --locked --features backend-tests --no-fail-fast --test serve "s3::"

  backends-postgres:
    # The PostgreSQL catalog's connector and pool (the postgres feature, a
    # preview) and `serve` with its catalogs in PostgreSQL, against real
    # servers: PostgreSQL 16, the oldest release supported, and 18, the
    # newest, each image pinned by the digest of its multi-platform index.
    # scripts/pg-test-server.sh starts each version's primary with TLS, a
    # hot standby of it and a server with ssl off, with `docker run`, not as
    # service containers: a service container starts before the job's first
    # step, so it could not load the certificates the script makes. RustFS
    # is a service container, as in `backends`, since a PostgreSQL catalog
    # needs its objects in a bucket. The tests fail, never skip, when a
    # server is not there.
    name: catalog backends (PostgreSQL ${{ matrix.postgres.major }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - major: '16'
            image: postgres@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36 # 16.15-alpine
          - major: '18'
            image: postgres@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5 # 18.6-alpine
    services:
      rustfs:
        image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2 # 1.0.4
        env:
          RUSTFS_ACCESS_KEY: vcontest
          RUSTFS_SECRET_KEY: vcon-ci-only-secret
        ports:
          - 127.0.0.1:9000:9000
    env:
      VCON_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      VCON_TEST_S3_ACCESS_KEY: vcontest
      VCON_TEST_S3_SECRET_KEY: vcon-ci-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the pinned cargo-nextest
        # The tests run under it, for the per-test deadline in
        # .config/nextest.toml; scripts/nextest.sh pins it by SHA-256, and
        # the action fetches it through the one pinned-download rule.
        uses: ./.github/actions/nextest
      - name: Wait for RustFS
        # A store listens before it can serve: the script waits for a
        # signed request to answer 200.
        run: scripts/wait-for-s3.sh RustFS
      - name: Start PostgreSQL ${{ matrix.postgres.major }}
        # The script records each container and the network it makes, for
        # the last step; its env file names the servers for the tests.
        env:
          IMAGE: ${{ matrix.postgres.image }}
          MAJOR: ${{ matrix.postgres.major }}
        run: |
          set -euo pipefail
          scripts/retry.sh docker pull --quiet "$IMAGE"
          scripts/pg-test-server.sh start "$IMAGE" "$RUNNER_TEMP/pg"
          grep -qx "VCON_TEST_PG_MAJOR=$MAJOR" "$RUNNER_TEMP/pg/env"
          cat "$RUNNER_TEMP/pg/env" >> "$GITHUB_ENV"
      - name: Clippy with the PostgreSQL catalog
        run: |
          cargo clippy -p vcon-server --all-targets --locked --features postgres -- -D warnings
          cargo clippy -p vcon-server --all-targets --locked --features postgres,backend-tests -- -D warnings
      - name: Catalog backend tests
        # The serve test runs the binary, which locks all of its memory.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          scripts/nextest.sh run -p vcon-server --locked --features postgres,backend-tests --no-fail-fast --lib "backend::postgres::" "backend::catalog_tests::" "config::"
          scripts/nextest.sh run -p vcon-server --locked --features postgres,backend-tests --no-fail-fast --test serve "postgres::"
      - name: Remove the PostgreSQL containers
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/pg" ]; then
            scripts/pg-test-server.sh stop "$RUNNER_TEMP/pg"
          fi

  coverage:
    name: coverage
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      LLVM_COV_VERSION: '0.9.1'
      LLVM_COV_SHA256: 'b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a'
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Get the pinned cargo-llvm-cov
        id: llvm-cov
        uses: ./.github/actions/pinned-download
        with:
          name: cargo-llvm-cov
          version: ${{ env.LLVM_COV_VERSION }}
          sha256: ${{ env.LLVM_COV_SHA256 }}
          url: https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${{ env.LLVM_COV_VERSION }}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          file: cargo-llvm-cov.tar.gz
      - name: Install the pinned toolchain and cargo-llvm-cov
        env:
          ARCHIVE: ${{ steps.llvm-cov.outputs.path }}
        run: |
          set -euo pipefail
          scripts/retry.sh rustup toolchain install
          scripts/retry.sh rustup component add llvm-tools
          tar xzf "$ARCHIVE" -C "$HOME/.cargo/bin" cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the pinned cargo-nextest
        # The tests run under it, for the per-test deadline in
        # .config/nextest.toml; scripts/nextest.sh pins it by SHA-256, and
        # the action fetches it through the one pinned-download rule.
        uses: ./.github/actions/nextest
      - name: Measure
        # The same tests as above, so the same memory-lock limit.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          # llvm-cov starts cargo nextest itself, so the version is checked
          # first; nextest reads .config/nextest.toml from the workspace.
          scripts/nextest.sh check
          cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --json --summary-only --output-path coverage-summary.json
          python3 -I scripts/published_metrics.py --coverage coverage-summary.json
      # pages.yml reads this artifact from CI's run of the commit it deploys.
      - name: Keep the coverage summary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage-summary.json
          retention-days: 14
          if-no-files-found: error
      # Sent only where the repository's Codecov token is set; a pull request
      # from a fork has none, and the measure above still runs.
      - name: Send to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true

  fuzz-targets:
    name: list the fuzz targets
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: List
        id: list
        # Read from fuzz/Cargo.toml, so a new target runs here with no list
        # to keep in step.
        run: |
          set -euo pipefail
          targets="$(scripts/fuzz.sh list | python3 -I -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: fuzz-targets
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/fuzz-setup
      - name: Run for 60 seconds from the seeds
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz.sh run "$TARGET" 60
      - name: Plant a panic where the target reads; the target must find it
        env:
          TARGET: ${{ matrix.target }}
        run: PLANT_SECONDS=300 scripts/fuzz.sh plant "$TARGET"
      # A crash input is kept for 7 days, to be turned into a regression
      # test; it is never committed as it is.
      - name: Keep the crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 7
          if-no-files-found: ignore

  clients:
    name: client examples against a live server
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          # The Go client uses the standard library only: no go.sum to cache.
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Runs clients/typescript/vcon-client.ts as it is (type stripping).
          node-version: '24'
      - name: Check each client
        # Go: gofmt must have nothing to rewrite, then vet. TypeScript: npm ci
        # installs exactly the tree package-lock.json pins, and tsc
        # type-checks the client. Python: it compiles. The Rust client is a
        # workspace member, so the clippy job holds it to -D warnings.
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l clients/go)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite: $unformatted"
            exit 1
          fi
          (cd clients/go && go vet ./...)
          (cd clients/typescript && ../../scripts/retry.sh npm ci --ignore-scripts --no-audit --no-fund && npx --no-install tsc --noEmit)
          python3 -m py_compile clients/python/vcon_client.py
      - name: Build the server and the Rust client
        run: cargo build --locked -p vcon-server -p vcon-client
      - name: Run every client against a live server
        # The server locks all of its memory; the runner's default lock limit
        # is too small.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          scripts/run-clients.sh target/debug/vcon-server target/debug/vcon-client

  scan:
    name: no AI attribution or personal data
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan every tracked file
        # The same rules the commit hook applies to staged lines, applied to
        # the whole tree: each path, then each line of each text file.
        run: |
          set -euo pipefail
          { git ls-files | awk '{ printf "%s\t%s\n", $0, $0 }'
            git grep -I --full-name -e '' | sed 's/:/\t/'
          } | python3 -I scripts/scan_forbidden.py
      # The rule's tests, then the pages that state the floor against
      # release.yml's GLIBC_FLOOR.
      - name: The glibc floor rule for release binaries
        run: |
          set -euo pipefail
          python3 -I scripts/test_check_glibc.py
          python3 -I scripts/check_glibc.py --docs .
      # A second class or test method of one name replaces the first,
      # whose tests then never run.
      - name: No test module defines a name twice
        run: |
          set -euo pipefail
          python3 -I scripts/test_check_test_names.py
          python3 -I scripts/check_test_names.py
      - name: The rule for AI attribution and personal data
        run: python3 -I scripts/test_scan_forbidden.py
      # A toolchain or tool download retries, so a runner's dropped
      # connection does not fail a job, and a release asset goes through
      # scripts/fetch-pinned.sh (scripts/check_workflow_downloads.py).
      - name: Every download retries
        run: |
          set -euo pipefail
          scripts/test-retry.sh
          python3 -I scripts/test_workflow_downloads.py
          python3 -I scripts/test_dnf_install.py
          python3 -I scripts/test_apt_mirror_setup.py
          python3 -I scripts/test_wait_for_s3.py
          python3 -I scripts/test_fetch_pinned.py
      # A tag or a branch can be moved to other code; a commit id cannot
      # (scripts/check_action_pins.py).
      - name: Every action is pinned by commit
        run: |
          set -euo pipefail
          python3 -I scripts/test_check_action_pins.py
          python3 -I scripts/check_action_pins.py
      - name: Paths the Best Practices answers link to
        run: python3 -I scripts/test_check_repo_links.py
      - name: The rule for the home page's numbers
        run: python3 -I scripts/test_published_metrics.py
      - name: The site's link checker
        run: python3 -I scripts/test_check_site_links.py
      - name: Dependabot watches every dependency file
        run: |
          set -euo pipefail
          python3 -I scripts/test_check_dependabot.py
          python3 -I scripts/check_dependabot.py
      - name: Every test run has the per-test deadline
        run: |
          set -euo pipefail
          scripts/test-nextest.sh
          python3 -I scripts/test_check_test_runner.py
          python3 -I scripts/check_test_runner.py
      - name: Test builds on aarch64 link with lld; release builds do not
        run: scripts/test-cc-lld.sh
      - name: The required checks are the jobs that run on every pull request
        # Both ways, against main's rules as GitHub holds them now: a
        # required check that never reports blocks every merge, and a job
        # on every pull request that no required check needs lets a red
        # result merge.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I scripts/test_check_required_checks.py
          scripts/retry.sh gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > "$RUNNER_TEMP/rules.json"
          python3 -I scripts/check_required_checks.py "$RUNNER_TEMP/rules.json"
      - name: CI success needs every job of this workflow
        run: |
          set -euo pipefail
          python3 -I scripts/test_ci_success.py
          python3 -I scripts/ci_success.py check

  hooks:
    name: git hooks
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        # The commit hook runs rustfmt, clippy and the tests on its fixture
        # crate, rustfmt from the nightly scripts/rustfmt.sh pins.
        run: |
          set -euo pipefail
          scripts/retry.sh rustup toolchain install
          scripts/rustfmt.sh install
      - name: Install the pinned cargo-nextest
        # The commit hook runs the fixture's tests under it.
        uses: ./.github/actions/nextest
      # Each hook in a throwaway repository: every forbidden item staged or
      # written in a message is refused, clean changes pass; the push hook
      # refuses unsigned and foreign commits and forbidden messages.
      # The tests make their own repositories; this one must not change.
      - name: Note this repository's config
        run: cp .git/config "$RUNNER_TEMP/config.before"
      - name: The commit hooks
        run: scripts/test-hooks.sh
      # Reported even when the commit hooks' test failed.
      - name: The push hook
        if: success() || failure()
        run: scripts/test-pre-push.sh
      - name: This repository's config is as it was
        if: success() || failure()
        run: cmp .git/config "$RUNNER_TEMP/config.before"
      # Each test run from inside a real hook of a scratch repository with a
      # linked worktree, where git sets GIT_DIR and the rest: that
      # repository's config and branch must be left as they were.
      - name: Each hook test leaves a hook's repository alone
        if: success() || failure()
        run: scripts/test-hook-isolation.sh scripts/test-hooks.sh scripts/test-pre-push.sh scripts/test-scan-commit-messages.sh

  messages:
    name: commit messages
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history, so the commits of the push or pull request
          # are all here to read.
          fetch-depth: 0
      # The scanner must refuse planted messages, or a clean result below
      # proves nothing.
      - name: The scanner refuses a planted message
        run: scripts/test-scan-commit-messages.sh
      # Every commit the push or pull request brings, whole message (%B),
      # # lines included: a commit made with --no-verify or by another
      # tool never ran the commit-msg hook.
      - name: Every commit message of this push or pull request
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request) range=("$PR_BASE..$PR_HEAD") ;;
            push) if [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ]; then range=("$BEFORE..$AFTER"); else range=(-1 "$AFTER"); fi ;;
            *) range=(-1 "$AFTER") ;;
          esac
          mapfile -t commits < <(git rev-list "${range[@]}")
          echo "scanning ${#commits[@]} commit message(s): ${range[*]}"
          # Every push and pull request brings a commit; none found means
          # the range is wrong, not that there is nothing to check.
          [ "${#commits[@]}" -gt 0 ] || { echo "::error::no commits in ${range[*]}"; exit 1; }
          scripts/scan-commit-messages.sh "${commits[@]}"

  deny:
    name: cargo-deny (licences, bans, sources)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: '0.20.2'
      # From the release's own .sha256 file.
      CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Get the pinned cargo-deny
        id: cargo-deny
        uses: ./.github/actions/pinned-download
        with:
          name: cargo-deny
          version: ${{ env.CARGO_DENY_VERSION }}
          sha256: ${{ env.CARGO_DENY_SHA256 }}
          url: https://github.com/EmbarkStudios/cargo-deny/releases/download/${{ env.CARGO_DENY_VERSION }}/cargo-deny-${{ env.CARGO_DENY_VERSION }}-x86_64-unknown-linux-musl.tar.gz
          file: cargo-deny.tar.gz
      - name: Install the pinned toolchain and cargo-deny
        env:
          ARCHIVE: ${{ steps.cargo-deny.outputs.path }}
        run: |
          set -euo pipefail
          scripts/retry.sh rustup toolchain install
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          tar xzf "$ARCHIVE" --strip-components=1 "${name}/cargo-deny"
          sudo install -m 0755 cargo-deny /usr/local/bin/cargo-deny
          rm -f cargo-deny
          cargo-deny --version
      # deny.toml's rules, on the workspace and on the fuzz package, which
      # has its own Cargo.lock. Advisories are osv-scanner.yml's job.
      - name: Licences, bans and sources
        run: |
          set -euo pipefail
          cargo-deny check licenses bans sources
          cargo-deny --manifest-path fuzz/Cargo.toml --config deny.toml check licenses bans sources

  site:
    name: website
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: '0.23.6'
      ZOLA_SHA256: '8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Get the pinned Zola
        id: zola
        uses: ./.github/actions/pinned-download
        with:
          name: zola
          version: ${{ env.ZOLA_VERSION }}
          sha256: ${{ env.ZOLA_SHA256 }}
          url: https://github.com/getzola/zola/releases/download/v${{ env.ZOLA_VERSION }}/zola-v${{ env.ZOLA_VERSION }}-x86_64-unknown-linux-gnu.tar.gz
          file: zola.tar.gz
      - name: Install Zola
        env:
          ARCHIVE: ${{ steps.zola.outputs.path }}
        run: |
          set -euo pipefail
          tar xzf "$ARCHIVE" zola
          sudo install -m 0755 zola /usr/local/bin/zola
          rm -f zola
      - name: Check the site
        run: scripts/check-site.sh
      # The same Node as the console job, checked by hash.
      - name: Install Node
        env:
          NODE_VERSION: '24.22.1'
          NODE_SHA256: '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6'
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o node.tar.xz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  node.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar xJf node.tar.xz -C "$RUNNER_TEMP/node" --strip-components=1
          rm -f node.tar.xz
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Install Playwright, axe-core and the browser
        # package-lock.json pins every package by version and integrity hash;
        # the Playwright version fixes the browser build it installs.
        working-directory: site-tests
        run: |
          set -euo pipefail
          ../scripts/retry.sh npm ci
          ../scripts/retry.sh npx playwright install --with-deps --only-shell chromium
      - name: The site in a browser (WCAG 2.2 AA, layout, no console error)
        run: scripts/test-site.sh

  brand:
    name: logo files match their source
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      RESVG_VERSION: '0.49.0'
      RESVG_SHA256: '216637e75e909e53e3098b0875cd5f7da2fdc8b4359771b4a29b539afff9d3f5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Get the pinned resvg
        id: resvg
        uses: ./.github/actions/pinned-download
        with:
          name: resvg
          version: ${{ env.RESVG_VERSION }}
          sha256: ${{ env.RESVG_SHA256 }}
          url: https://github.com/linebender/resvg/releases/download/v${{ env.RESVG_VERSION }}/resvg-linux-x86_64.tar.gz
          file: resvg.tar.gz
      - name: Install resvg and fontTools
        env:
          ARCHIVE: ${{ steps.resvg.outputs.path }}
        run: |
          set -euo pipefail
          tar xzf "$ARCHIVE" resvg
          sudo install -m 0755 resvg /usr/local/bin/resvg
          rm -f resvg
          python3 -m venv "$RUNNER_TEMP/icons"
          "$RUNNER_TEMP/icons/bin/pip" install --require-hashes --no-deps --only-binary :all: \
            -r scripts/icons-requirements.txt
      - name: Check the logo files
        run: '"$RUNNER_TEMP/icons/bin/python" scripts/icons.py --check'

  console:
    name: console in a browser
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24.22.1'
      NODE_SHA256: '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Node
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o node.tar.xz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  node.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar xJf node.tar.xz -C "$RUNNER_TEMP/node" --strip-components=1
          rm -f node.tar.xz
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Install Playwright and its browser
        # package-lock.json pins every package by version and integrity hash;
        # the Playwright version fixes the browser build it installs.
        working-directory: console-tests
        run: |
          set -euo pipefail
          node --version
          ../scripts/retry.sh npm ci
          ../scripts/retry.sh npx playwright install --with-deps --only-shell chromium
      - name: Browser tests
        # The server locks all of its memory, as in the tests job.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          scripts/test-console.sh

  docs-binary:
    name: how-to pages, the runner and the server
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The runner's own tests, and the rules every tested page keeps
        run: |
          set -euo pipefail
          python3 -I scripts/test_docs_test.py
          python3 -I scripts/docs_test.py lint
      - name: List the scenarios
        id: list
        # Read from scripts/docs_test.py, so a new scenario runs here with no
        # list to keep in step.
        run: echo "scenarios=$(python3 -I scripts/docs_test.py list)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned toolchain
        run: scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the server
        run: cargo build --locked -p vcon-server
      - name: Keep the server for the scenarios
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-vcon-server
          path: target/debug/vcon-server
          retention-days: 1
          if-no-files-found: error
      # The postgres scenario's pages need the postgres cargo feature, which
      # the default build does not have (`docs_test.py artifact <scenario>`
      # names the artifact each scenario gets; scripts/test_docs_test.py
      # holds these steps to the scenarios' features). Built after the
      # default server is kept, since it replaces target/debug/vcon-server.
      - name: Build the server with the postgres feature
        run: cargo build --locked -p vcon-server --features postgres
      - name: Keep that server for the postgres scenario
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-vcon-server-postgres
          path: target/debug/vcon-server
          retention-days: 1
          if-no-files-found: error

  docs:
    name: how-to ${{ matrix.scenario }} against a live server
    needs: docs-binary
    timeout-minutes: 75
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.docs-binary.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Find the server this scenario runs
        id: server
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: echo "artifact=$(python3 -I scripts/docs_test.py artifact "$SCENARIO")" >> "$GITHUB_OUTPUT"
      - name: Get the server built from this commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.server.outputs.artifact }}
          path: ${{ runner.temp }}/server
      # The release assets the pages download (scripts/docs-test-pins.txt),
      # as main last fetched them. docs_test.py's mirror checks each file's
      # sha256 before it serves it, hit or miss.
      - name: Restore the pinned release assets
        id: pinned
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/docs-pinned
          key: pinned-docs-${{ matrix.scenario }}-${{ hashFiles('scripts/docs-test-pins.txt') }}
      - name: Run the pages' commands and compare what each prints
        # Each scenario runs in a fresh container (see scripts/docs_test.py).
        # GH_TOKEN lets the install page's `gh attestation verify` read the
        # release's attestations.
        env:
          SCENARIO: ${{ matrix.scenario }}
          GH_TOKEN: ${{ github.token }}
          DOCS_TEST_PINNED: ${{ runner.temp }}/docs-pinned
        run: |
          set -euo pipefail
          chmod 0755 "$RUNNER_TEMP/server/vcon-server"
          mkdir -p "$DOCS_TEST_PINNED"
          python3 -I scripts/docs_test.py run "$SCENARIO" --binary "$RUNNER_TEMP/server/vcon-server"
      - name: Note whether the scenario downloaded anything
        id: kept
        if: always()
        run: |
          if [ -n "$(find "$RUNNER_TEMP/docs-pinned" -type f 2>/dev/null | head -1)" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      # Only verified bytes are in the directory, so a run whose pages
      # failed may still save what it fetched.
      - name: Save the pinned release assets
        if: always() && steps.kept.outputs.any == 'true' && steps.pinned.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/docs-pinned
          key: pinned-docs-${{ matrix.scenario }}-${{ hashFiles('scripts/docs-test-pins.txt') }}

  # The one check of this workflow the main branch's ruleset must name. It
  # needs every job above, so the how-to scenarios and the fuzz targets,
  # whose check names change with their matrices and which start only after
  # docs-binary and fuzz-targets, gate a merge as well. It runs even when a
  # job failed (a skipped check would pass the ruleset) and passes only when
  # every job succeeded (scripts/ci_success.py; the scan job checks that
  # this list names every job).
  ci-success:
    name: CI success
    if: always()
    needs: [rust, backends, backends-minio, backends-postgres, coverage, fuzz-targets, fuzz, clients, scan, hooks, messages, deny, site, brand, console, docs-binary, docs]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Every job above succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I scripts/ci_success.py verdict
