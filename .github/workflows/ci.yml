name: CI

# The checks the commit hook runs, run again on GitHub for every push to main
# and every pull request, so a change that skipped the hook is still caught.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  rust:
    name: fmt, clippy, tests
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        # rust-toolchain.toml names the version and its components.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        # The fuzz package is a workspace of its own, so --all misses it.
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: Tests
        # Every command locks all of its memory before it reads a key, and the
        # tests run the binary; the runner's default lock limit is too small.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          # Every failing test binary reported, not only the first.
          cargo test --workspace --locked --no-fail-fast
          cargo test --manifest-path fuzz/Cargo.toml --lib --locked
      - name: Packages
        # What each crate would publish to crates.io, checked from the
        # .crate files themselves; the commit hook runs the same.
        run: |
          set -euo pipefail
          python3 -I scripts/test_check_package.py
          python3 -I scripts/check_package.py
          # Two runs in one target directory, and two trees at once.
          bash scripts/test-check-package.sh

  coverage:
    name: coverage
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      LLVM_COV_VERSION: '0.9.1'
      LLVM_COV_SHA256: 'b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a'
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and cargo-llvm-cov
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup component add llvm-tools
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o llvm-cov.tar.gz \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LLVM_COV_SHA256}  llvm-cov.tar.gz" | sha256sum -c -
          tar xzf llvm-cov.tar.gz -C "$HOME/.cargo/bin" cargo-llvm-cov
          rm -f llvm-cov.tar.gz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Measure
        # The same tests as above, so the same memory-lock limit.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
      # Sent only where the repository's Codecov token is set; a pull request
      # from a fork has none, and the measure above still runs.
      - name: Send to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true

  fuzz-targets:
    name: list the fuzz targets
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: List
        id: list
        # Read from fuzz/Cargo.toml, so a new target runs here with no list
        # to keep in step.
        run: |
          set -euo pipefail
          targets="$(scripts/fuzz.sh list | python3 -I -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: fuzz-targets
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/fuzz-setup
      - name: Run for 60 seconds from the seeds
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz.sh run "$TARGET" 60
      - name: Plant a panic where the target reads; the target must find it
        env:
          TARGET: ${{ matrix.target }}
        run: PLANT_SECONDS=300 scripts/fuzz.sh plant "$TARGET"
      # A crash input is kept for 7 days, to be turned into a regression
      # test; it is never committed as it is.
      - name: Keep the crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 7
          if-no-files-found: ignore

  clients:
    name: client examples against a live server
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          # The Go client uses the standard library only: no go.sum to cache.
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Runs clients/typescript/vcon-client.ts as it is (type stripping).
          node-version: '24'
      - name: Check each client
        # Go: gofmt must have nothing to rewrite, then vet. TypeScript: npm ci
        # installs exactly the tree package-lock.json pins, and tsc
        # type-checks the client. Python: it compiles. The Rust client is a
        # workspace member, so the clippy job holds it to -D warnings.
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l clients/go)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite: $unformatted"
            exit 1
          fi
          (cd clients/go && go vet ./...)
          (cd clients/typescript && npm ci --ignore-scripts --no-audit --no-fund && npx --no-install tsc --noEmit)
          python3 -m py_compile clients/python/vcon_client.py
      - name: Build the server and the Rust client
        run: cargo build --locked -p vcon-server -p vcon-client
      - name: Run every client against a live server
        # The server locks all of its memory; the runner's default lock limit
        # is too small.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          scripts/run-clients.sh target/debug/vcon-server target/debug/vcon-client

  scan:
    name: no AI attribution or personal data
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan every tracked file
        # The same rules the commit hook applies to staged lines, applied to
        # the whole tree: each path, then each line of each text file.
        run: |
          set -euo pipefail
          { git ls-files | awk '{ printf "%s\t%s\n", $0, $0 }'
            git grep -I --full-name -e '' | sed 's/:/\t/'
          } | python3 -I scripts/scan_forbidden.py
      - name: Paths the Best Practices answers link to
        run: python3 -I scripts/test_check_repo_links.py

  site:
    name: website
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: '0.23.6'
      ZOLA_SHA256: '8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Zola
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar xzf zola.tar.gz zola
          sudo install -m 0755 zola /usr/local/bin/zola
          rm -f zola zola.tar.gz
      - name: Check the site
        run: scripts/check-site.sh

  brand:
    name: logo files match their source
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      RESVG_VERSION: '0.49.0'
      RESVG_SHA256: '216637e75e909e53e3098b0875cd5f7da2fdc8b4359771b4a29b539afff9d3f5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install resvg and fontTools
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o resvg.tar.gz \
            "https://github.com/linebender/resvg/releases/download/v${RESVG_VERSION}/resvg-linux-x86_64.tar.gz"
          echo "${RESVG_SHA256}  resvg.tar.gz" | sha256sum -c -
          tar xzf resvg.tar.gz resvg
          sudo install -m 0755 resvg /usr/local/bin/resvg
          rm -f resvg resvg.tar.gz
          python3 -m venv "$RUNNER_TEMP/icons"
          "$RUNNER_TEMP/icons/bin/pip" install --require-hashes --no-deps --only-binary :all: \
            -r scripts/icons-requirements.txt
      - name: Check the logo files
        run: '"$RUNNER_TEMP/icons/bin/python" scripts/icons.py --check'

  console:
    name: console in a browser
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24.22.1'
      NODE_SHA256: '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Node
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o node.tar.xz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  node.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar xJf node.tar.xz -C "$RUNNER_TEMP/node" --strip-components=1
          rm -f node.tar.xz
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Install Playwright and its browser
        # package-lock.json pins every package by version and integrity hash;
        # the Playwright version fixes the browser build it installs.
        working-directory: console-tests
        run: |
          set -euo pipefail
          node --version
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: Browser tests
        # The server locks all of its memory, as in the tests job.
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          scripts/test-console.sh
