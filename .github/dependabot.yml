# Dependabot proposes dependency updates as pull requests, once a week.
# Each pull request runs CI like any other. scripts/check_dependabot.py,
# run in CI, fails when a dependency file in the tree has no entry here.
version: 2
updates:
  # The Cargo workspace at the repository root (both crates, one Cargo.lock).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # vcon-server's tests use a git fork of rusqlite that keeps the name
      # rusqlite (rusqlite_fork in crates/vcon-server/Cargo.toml). Bumping
      # crates.io rusqlite rewrote the fork's requirement too, so the update
      # job failed (2026-11-03). Both are updated by hand, after a dated
      # check of upstream rusqlite releases and the SQLCipher and RustSec
      # advisories. scripts/check_dependabot.py fails while a git package is
      # not ignored here, or after the fork is gone.
      - dependency-name: "rusqlite"
    groups:
      # Minor and patch bumps in one pull request; a major bump gets its own.
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The fuzz package, a workspace of its own with its own Cargo.lock. It
  # takes rusqlite from crates.io only, so it keeps rusqlite's updates.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-fuzz-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The actions the workflows in .github/workflows and the local action in
  # .github/actions/fuzz-setup use, pinned by commit. Dependabot updates the
  # commit and the version comment beside it.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/fuzz-setup"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Every action bump in one pull request.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # The TypeScript client example, the console's browser tests and the
  # site's browser tests, each with its own package-lock.json.
  - package-ecosystem: "npm"
    directories:
      - "/clients/typescript"
      - "/console-tests"
      - "/site-tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # @types/node describes one Node major's API. The TypeScript client
      # type-checks against the Node CI runs it on (node-version '24' in
      # ci.yml; engines >=22.18), so a newer major's types would accept
      # calls the supported Node lacks. Raise it with CI's Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch bumps in one pull request; a major bump gets its own.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The Python packages scripts/icons.py uses, pinned with their hashes in
  # scripts/icons-requirements.txt.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The ClusterFuzzLite builder image, pinned by digest.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
