# Dependabot proposes dependency updates as pull requests, once a week.
# Each pull request runs CI like any other. scripts/check_dependabot.py,
# run in CI, fails when a dependency file in the tree has no entry here.
#
# Every entry waits 14 days after a version is released before it proposes
# it (cooldown; CONTRIBUTING.md, "Dependency versions"), and
# check_dependabot.py fails on an entry with less. Security updates are not
# delayed: Dependabot applies no cooldown to them.
version: 2
updates:
  # The Cargo workspace at the repository root (both crates, one Cargo.lock)
  # and the fuzz package, a workspace of its own with its own Cargo.lock.
  # One entry for both: the fuzz package takes both crates by path, so a
  # bump of a requirement in crates/vcon-server/Cargo.toml (the exact
  # parquet pin, or any major bump) must update both lockfiles in one pull
  # request. With an entry each, #142 and #143 each updated one lockfile and
  # left the other behind, so every --locked build failed (2026-11-07).
  # check_dependabot.py fails when the two are split again.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    ignore:
      # vcon-server's tests use a git fork of rusqlite that keeps the name
      # rusqlite (rusqlite_fork in crates/vcon-server/Cargo.toml). Bumping
      # crates.io rusqlite rewrote the fork's requirement too, so the update
      # job failed (2026-11-03). The fork and crates.io rusqlite, in both
      # lockfiles, are updated by hand, after a dated check of upstream
      # rusqlite releases and the SQLCipher and RustSec advisories.
      # scripts/check_dependabot.py fails while a git package is not ignored
      # here, or after the fork is gone.
      - dependency-name: "rusqlite"
    groups:
      # Minor and patch bumps in one pull request; a major bump gets its own.
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The actions the workflows in .github/workflows and the local actions in
  # .github/actions use, pinned by commit. Dependabot updates the
  # commit and the version comment beside it.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/fuzz-setup"
      - "/.github/actions/nextest"
      - "/.github/actions/pinned-download"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # Every action bump in one pull request.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # The TypeScript client example, the console's browser tests and the
  # site's browser tests, each with its own package-lock.json.
  - package-ecosystem: "npm"
    directories:
      - "/clients/typescript"
      - "/console-tests"
      - "/site-tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # @types/node describes one Node major's API. The TypeScript client
      # type-checks against the Node CI runs it on (node-version '24' in
      # ci.yml; engines >=22.18), so a newer major's types would accept
      # calls the supported Node lacks. Raise it with CI's Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch bumps in one pull request; a major bump gets its own.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The Python packages scripts/icons.py uses, pinned with their hashes in
  # scripts/icons-requirements.txt.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The ClusterFuzzLite builder image, pinned by digest.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
