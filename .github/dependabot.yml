# Dependabot proposes dependency updates as pull requests, once a week.
# Each pull request runs CI like any other. scripts/check_dependabot.py,
# run in CI, fails when a dependency file in the tree has no entry here.
version: 2
updates:
  # The Cargo workspace at the repository root (both crates, one Cargo.lock),
  # and the fuzz package, a workspace of its own with its own Cargo.lock.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Minor and patch bumps in one pull request; a major bump gets its own.
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The actions the workflows in .github/workflows and the local action in
  # .github/actions/fuzz-setup use, pinned by commit. Dependabot updates the
  # commit and the version comment beside it.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/fuzz-setup"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Every action bump in one pull request.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # The TypeScript client example and the console's browser tests, each
  # with its own package-lock.json.
  - package-ecosystem: "npm"
    directories:
      - "/clients/typescript"
      - "/console-tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps in one pull request; a major bump gets its own.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The Python packages scripts/icons.py uses, pinned with their hashes in
  # scripts/icons-requirements.txt.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # The ClusterFuzzLite builder image, pinned by digest.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
