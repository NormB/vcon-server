name: Pinned download
description: >-
  Put one pinned release asset in the job's temporary directory, from the
  actions cache when an earlier run on main fetched it and from its URL only
  on a miss. scripts/fetch-pinned.sh checks the sha256 on every run, hit or
  miss, and retries an outage for up to five minutes.

# WHY THIS EXISTS
#
# On 2026-11-08, and again on 2026-11-09 at about 05:15Z, github.com answered
# release downloads with HTTP 504. main's CI on 2cb225a30 went red at every
# job that fetched cargo-nextest, DuckDB, cargo-fuzz or a vcon-server
# release, each one live `curl --retry 5 --retry-delay 5` of a pinned,
# checksummed asset: about 25 s of retries. The code was green.
#
# ONE RULE. Every pinned release download in a workflow or action goes
# through this action, or, where no cache can help (release.yml, a tag run),
# through scripts/fetch-pinned.sh directly. scripts/check_workflow_downloads.py
# fails a step that fetches a release asset any other way, and holds the
# shape below (pinned_action_problems).
#
# - The key is the tool's name, its version and the sha256. A new version or
#   a new hash is a new key, so a cached file is never used for a pin it was
#   not fetched for.
# - The fetch step runs on every run, with no `if:`. On a hit it hashes the
#   restored file, and a file that does not match is deleted and fetched
#   again: a cache entry is data another run wrote, and it is trusted no more
#   than a download. An entry is never overwritten, so the script's warning
#   names it for deletion (gh cache delete <key>).
# - The save runs only after a miss and only on main: an entry a pull request
#   run saves is readable only by that pull request, yet counts against the
#   repository's 10 GB.
# - The directory is the job's own ${{ runner.temp }}, so two jobs on one
#   machine never share a file.
#
# The how-to (bumping a pin, an outage) is in the development page,
# website/content/docs/development.md, under "Pinned tool downloads".
inputs:
  name:
    description: >-
      The tool, e.g. zola. Names the cache key and the directory, so two tools
      never share either. Letters, digits, dots and hyphens.
    required: true
  version:
    description: The pinned version, e.g. 0.23.6. Part of the cache key.
    required: true
  sha256:
    description: The asset's pinned sha256, 64 lowercase hex digits.
    required: true
  url:
    description: Where to fetch the asset on a cache miss.
    required: true
  file:
    description: The file name to keep the asset under, e.g. zola.tar.gz.
    required: true
outputs:
  path:
    description: The absolute path of the verified asset.
    value: ${{ steps.fetch.outputs.path }}
runs:
  using: composite
  steps:
    - name: Restore the pinned asset
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/vcon-pinned/${{ inputs.name }}
        key: pinned-${{ inputs.name }}-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Verify the restored asset, or fetch it
      id: fetch
      shell: bash
      env:
        URL: ${{ inputs.url }}
        SHA256: ${{ inputs.sha256 }}
        DEST: ${{ runner.temp }}/vcon-pinned/${{ inputs.name }}/${{ inputs.file }}
      run: |
        set -euo pipefail
        bash "$GITHUB_WORKSPACE/scripts/fetch-pinned.sh" --url "$URL" --sha256 "$SHA256" --dest "$DEST"
        echo "path=$DEST" >> "$GITHUB_OUTPUT"

    - name: Save the pinned asset
      if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/vcon-pinned/${{ inputs.name }}
        key: pinned-${{ inputs.name }}-${{ inputs.version }}-${{ inputs.sha256 }}
