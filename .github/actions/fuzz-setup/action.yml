name: Set up fuzzing
description: Installs the nightly toolchain fuzz/rust-toolchain.toml names and cargo-fuzz, pinned by sha256, and restores the fuzz build cache.

runs:
  using: composite
  steps:
    # cargo-fuzz's version and sha256 are pinned here and nowhere else.
    - name: Get the pinned cargo-fuzz
      id: cargo-fuzz
      uses: ./.github/actions/pinned-download
      with:
        name: cargo-fuzz
        version: '0.13.2'
        sha256: 'b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c'
        url: https://github.com/rust-fuzz/cargo-fuzz/releases/download/0.13.2/cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz
        file: cargo-fuzz.tar.gz
    - name: Install the fuzz toolchain and cargo-fuzz
      shell: bash
      env:
        ARCHIVE: ${{ steps.cargo-fuzz.outputs.path }}
      run: |
        set -euo pipefail
        (cd fuzz && ../scripts/retry.sh rustup toolchain install)
        tar xzf "$ARCHIVE" -C "$HOME/.cargo/bin" cargo-fuzz
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: fuzz -> target
